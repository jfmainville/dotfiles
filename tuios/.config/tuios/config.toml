[appearance]
theme = "retrowave"
background = "off"
glyphs = "default"
dim_foreground = false
session_border = false
session_colors = true
git_dirty = true
global_session = false
dockbar_position = "top"
show_clock = true
show_cpu = true
show_ram = true
dock_workspace_tabs = true
dock_pill_caps = false
dock_prefix_indicator = "badge"
dock_compact = false
confirm_close = "never"
confirm_quit = false
whichkey_position = "bottom-right"
nvim_navigation = false
focus_wrap = false
new_window_inherit_cwd = true
new_window_follow_ssh = true
tiling_scheme = "spiral"

[startup]
tiled = true
daemon = true
open_default_window = true
layout = "bsp"
start_in_terminal_mode = true

[keybindings]
leader_key = "ctrl+a"
preset = "tmux"

[keybindings.prefix_mode]
last_pane = ["a"]
launcher = []
goto_picker = ["z"]
prefix_fullscreen = []
resize_pane_left_5 = ["opt+left", "ctrl+left", "shift+left"]
resize_pane_down_5 = ["opt+down", "ctrl+down", "shift+down"]
resize_pane_right_5 = ["opt+right", "ctrl+right", "shift+right"]
resize_pane_up_5 = ["opt+up", "ctrl+up", "shift+up"]

[keybindings.terminal_mode]
terminal_focus_left = ["ctrl+h", "alt+left"]
terminal_focus_down = ["ctrl+j", "alt+down"]
terminal_focus_up = ["ctrl+k", "alt+up"]
terminal_focus_right = ["ctrl+l", "alt+right"]
prefix_selection = ["alt+s"]

[spotlight]
enabled = false

[appearance.sidebar]
width = 30
enabled = true
show_numbers = true
file_icons = true
file_icon_colors = true
folder_click = "both"
file_drag = true
files_style = "tree"
file_delete = "trash"
group_main = false
marquee = true
subagent_rows = "rows"
subagent_collapse = "off"
subagent_max_rows = 0

[appearance.sidebar.right]
width = 30
enabled = true

[appearance.sidebar.left]
enabled = false

[dock]
left = ["mode", "workspaces", "trail", "tape"]
right = ["transfers", "notifications", "copy-help", "cpu", "ram", "clock", "session-controls"]
center = ["windows"]

[notifications]
level = "info"

[notifications.agent]
sound = true
sound_mode = "bell"

[workspaces]
new_window_when_empty = true

[hosts.pipmtllwks101]
addr = "pipmtllwks101"
