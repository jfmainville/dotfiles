[appearance]
theme = "retrowave"
background = "off"
glyphs = "unicode"
dim_foreground = true
session_border = false
session_colors = true
git_dirty = true
global_session = false
dockbar_position = "top"
show_clock = true
show_cpu = true
show_ram = true
dock_workspace_tabs = true
dock_pill_caps = true
dock_prefix_indicator = "pill"
dock_compact = false
confirm_close = "never"
confirm_quit = false
whichkey_position = "bottom-right"
nvim_navigation = false
focus_wrap = false
new_window_inherit_cwd = true
new_window_follow_ssh = true
tiling_scheme = "spiral"
dock_mode_pill = "tiling"
whichkey_enabled = true
whichkey_delay_ms = 700
wrap_lists = true
click_to_type = "double"
auto_enter_terminal_on_focus = "off"
right_click_opens_menu = false
zoom_max_width = 0
master_grid = true
link_hover = "safe"
link_click = "both"
links = "all"
border_style = "normal"
frame_panels = false
pane_overlays = false
window_title_position = "top"
window_title_style = "pill"
window_title_align = "left"
host_title = "session"
shared_borders = false
hide_window_buttons = true
window_button_style = "dots"
window_button_position = "right"
hide_scrollbar = false
border_gradient_angle = 45
gap = 0
drop_preview = "outline"
master_position = "left"
niri_scroll_snap = false
dock_mode_split_letter = false
dim_multifocus = false
niri_reverse_scroll = false
zoom_follows_focus = true
zoom_borderless = false
window_button_zoom = true

[startup]
tiled = true
daemon = true
open_default_window = true
layout = "bsp"
start_in_terminal_mode = true

[keybindings]
leader_key = "ctrl+a"
preset = "tmux"

[keybindings.prefix_mode]
last_pane = ["a"]
toggle_zoom = ["z"]
launcher = []
prefix_fullscreen = []
resize_pane_left_5 = ["opt+left", "ctrl+left", "shift+left"]
resize_pane_down_5 = ["opt+down", "ctrl+down", "shift+down"]
resize_pane_right_5 = ["opt+right", "ctrl+right", "shift+right"]
resize_pane_up_5 = ["opt+up", "ctrl+up", "shift+up"]

[keybindings.terminal_mode]
terminal_focus_left = ["ctrl+h", "alt+left"]
terminal_focus_down = ["ctrl+j", "alt+down"]
terminal_focus_up = ["ctrl+k", "alt+up"]
terminal_focus_right = ["ctrl+l", "alt+right"]
prefix_selection = ["alt+s"]

[spotlight]
enabled = false

[appearance.sidebar]
width = 30
enabled = false
show_numbers = true
file_icons = true
file_icon_colors = true
folder_click = "both"
file_drag = true
files_style = "tree"
file_delete = "trash"
editor = "nvim"
group_main = true
marquee = true
subagent_rows = "tree"
subagent_collapse = "off"
subagent_max_rows = 0
position = "right"
sections = "sessions,git,agents,spacer,files:50"
header_case = "uppercase"
row_style = "underline"
header_style = "rule"
density = "roomy"
show_glyphs = true
show_counts = false
file_actions = true
peek = false
tooltips = false
per_session = false

[appearance.sidebar.right]
width = 35
enabled = true

[appearance.sidebar.left]
enabled = false
width = 35

[appearance.sidebar.agent_row]
tokens = ["session", "need", "harness", "name", "elapsed", "context", "subagents", "pr", "meta", "now", "message"]

[dock]
left = ["mode", "session", "workspaces", "tape"]
right = ["notifications", "transfers", "copy-help", "cpu", "ram", "clock", "session-controls"]
center = ["windows"]

[notifications]
level = "warning"
style = "full"
bell = "both"
machine_offer = true
duration = 3

[notifications.agent]
sound = true
sound_mode = "bell"
enabled = true

[workspaces]
new_window_when_empty = true

[hosts.pipmtllwks101]
addr = "pipmtllwks101"

[agents]
view_list = "column"
name_hint = "off"
enabled = true
acp_version = 1
card_preview = "auto"
answer_advance = true
fold_working = false

[motion]
workspace = "slide"
layout = "on"
zoom = "on"

[daemon]
resume_agents = "auto"
keep_awake = "off"

[tasks]
auto_stage = true

[worktree]
setup_async = false

[appearance.scrollbar]
style = "track"

[review]
scope = "base"
focus = "diff"

[panes]
navigator_search = true
navigator_layout = "tree"
drag_and_drop = false

[hints]
all_panes = false

[appearance.selection]
multi_format = "plain"

[path_picker]
show_hidden = false

[shell]
login = false
integration = "auto"

[tape]
show_status = true
